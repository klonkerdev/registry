schema_version = 0
id = "imgui-menu"
description = "An in-game ImGui utility menu registered with a configurable keyboard toggle."
version = "0.1.0"
target_os = "windows"
build_system = "none"
favorite = false
tags = ["imgui", "menu", "ui"]

[[parameters]]
id = "toggle_key"
type = "choice"
label = "Menu toggle key"
description = "Windows virtual-key code passed to RegisterWindow."
required = true
default = "0x2D"
values = ["0x2D", "0x75", "0x76"]

[[prerequisites]]
id = "gof2_pc"
name = "Galaxy on Fire 2 Full HD for Windows"
description = "The generated folder is installed beneath the PC game's mods directory."
required_for = "run"

[[prerequisites]]
id = "kaamoclub_modapi"
name = "KaamoClubModApi with ImGui Lua bindings"
description = "RegisterWindow and the imgui object are provided by the ModAPI runtime."
required_for = "run"
